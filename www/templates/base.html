{% extends "skeleton.html" %}


{% macro render_link(endpoint, text) %}
<a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} class="current"{% endif %}>{{ text }}</a>
{% endmacro %}


{% block header %}
    <h2>{{ config.TITLE }}</h2>
    <nav>
        <ul>{% for navdata in navigation %}
            <li>{{ render_link(navdata.endpoint, navdata.text) }}</li>{% endfor %}
        </ul>
    </nav>
{% endblock %}
